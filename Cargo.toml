[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Ahmed Nefzaoui"]
publish = false

[workspace.dependencies]
mdm-cli = { path = "crates/cli" }
mdm-crash = { path = "crates/crash", default-features = false }
mdm-debrid = { path = "crates/debrid" }
mdm-engine = { path = "crates/engine" }
mdm-extract = { path = "crates/extract" }
mdm-geo = { path = "crates/geo" }
mdm-ipc = { path = "crates/ipc" }
mdm-labserver = { path = "crates/labserver" }
mdm-mcp = { path = "crates/mcp" }
mdm-remote = { path = "crates/remote" }
mdm-tools = { path = "crates/tools" }
mdm-torrent = { path = "crates/torrent" }

# storytold craft-libs (D-003), pinned by commit.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }

# UI: egui 0.37 on storytold's egui/winit forks, the same commits craft-libs uses (see [patch]).
# "clipboard": text boxes cut, copy and paste with the system clipboard (without it egui keeps
# a clipboard of its own, and Ctrl+V / Cmd+V never sees what other programs copied).
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
egui = "0.37.0"
# The lock that keeps MDM's own clipboard reads and writes apart from egui's (main.rs, #629).
egui-winit = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
dirs = "7.0.0"
# Gzipped IP blocklists, read to convert them for librqbit (crates/torrent blocklist.rs).
flate2 = "1.1.10"
arboard ={ version = "3.7.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
open = "5.4.5"

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
http-range-header = "0.4.2"
httpdate = "1.0.3"
# Checksum verification (crates/engine/src/verify.rs).
md-5 = "0.11.0"
sha1 = "0.11.0"
crc32fast = "1.5.3"
# Free space and file system per volume (disk preflight); only the disk part.
sysinfo = { version = "0.40.0", default-features = false, features = ["disk"] }
proptest = "1.12.0"
# HTTP/1.1 only: each engine worker must be one real TCP connection (notes/ENGINE.md §4).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
# FTP and FTPS (crates/engine/src/ftp.rs), with TLS through the rustls and platform verifier
# reqwest uses. "deprecated" is what enables implicit FTPS (ftps://, port 990).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# Custom DNS (#36): plain DNS, DNS over TLS and over HTTPS, with aws-lc-rs (no ring) and the
# platform's certificate checks, the same as downloads. Not its system config: "the system's DNS"
# stays tokio's own lookup.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "rustls-platform-verifier"] }
# Network adapter binding (#35, crates/engine/src/net.rs): sockets held to a device (Linux) or
# an interface index (macOS) need socket2's "all"; the adapter list; the system proxy resolved
# before a bound client is built. All three are already in the tree (tokio, hyper, librqbit).
socket2 = { version = "0.6.5", features = ["all"] }
network-interface = "2.0.5"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy-system"] }
# The release signatures' RSA and Ed25519 checks (crates/tools/src/openpgp.rs): the crypto
# library rustls brings anyway, with the same features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The MCP server (crates/mcp): the official Rust SDK, stdio only.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
# The lab FTP server's test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.2", default-features = false, features = ["std", "parse", "serde"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
percent-encoding = "2.3.2"
url = { version = "2.5.8", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# Denied everywhere; only crates/app/src/win32.rs (Windows FFI) opts in (D-008).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Whole-program optimisation in one unit: smaller and a little faster programs, for a slower
# release build (#25).
lto = "fat"
codegen-units = 1
# Function names and file:line for crash reports. The debug info doesn't ship: CI turns it into the
# release's symbols zip (tools/installer/symbols.py); Windows keeps it in the .pdb, which no
# download includes, and Linux and macOS strip it from the programs they ship.
debug = "line-tables-only"
# The whole program optimised for size (#158): with fat LTO it is optimised as one unit, at the
# program's own level, so this is what decides. It took 9 MB (21 %) off the app's program and
# 2.4 MB off the installer, for no measurable cost in a download's speed or CPU (a 2 GiB file and
# its SHA-256 from the lab server, 10 runs each: 5.2 s CPU before, 5.4 s after, within the
# runs' spread; the time is the disk's). "s" keeps loops vectorised ("z" doesn't).
opt-level = "s"

# Hashing is unusably slow unoptimised (a 3 MiB SHA-256 took seconds in debug tests): build
# the checksum crates optimised in dev too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# The app's build script packs the translation catalogs with brotli at its best (crates/app/
# build.rs): unoptimised, that takes minutes instead of seconds. Build scripts are unoptimised
# in release builds too.
[profile.dev.package.brotli]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
# Unpacking them at each start (crates/app/src/i18n.rs), in debug builds too.
[profile.dev.package.brotli-decompressor]
opt-level = 3

# Dependencies' debug info: file:line only, so backtraces still name them, in debug symbols a
# fraction of the size (every test program links them all). MDM's own crates keep full debug
# info, for stepping through them in a debugger.
[profile.dev.package."*"]
debug = "line-tables-only"

# storytold's egui fork (as storytold/craft-libs, D-003) plus MDM's commits on anefzaoui/egui
# (branch mdm-start-hidden, on mdm-wgpu, on mdm-accesskit-windows): every window created hidden
# gets an AccessKit adapter, with OpenGL (glow) and with Direct3D (wgpu, #89), so screen readers
# read the dialogs and menus; a dialog opened while the main window is minimized no longer panics
# (emilk/egui#8470); and a window's first accessibility request is answered with its last tree
# (#131); Direct3D keeps only the graphics adapter in use (a laptop's other GPU sleeps) and, on
# Intel Iris Xe, uploads no all-zero texel blocks (gfx-rs/wgpu#10651, #89); a hidden viewport
# can ask for a pass (Context::request_ui_pass: a dialog opened while minimized, #162); OpenGL
# without a usable configuration is an error, not a panic, so the next renderer is tried; a main
# window built hidden stays hidden after its first frame (a start with the session waits in the
# notification area, #226); a monitor that has just gone away has no size instead of a panic (#335); the clipboard used
# by one thread at a time, egui's copy and paste and MDM's own reads (`egui_winit::clipboard::
# lock_system_clipboard`, #629). craft-libs can take the same commits to share one egui again.
[patch.crates-io]
# librqbit 9.1.0 with per-torrent rate limits that change while a torrent runs (#39), and a
# magnet lookup's progress counted (#92), and every socket bound to one address (`bind_ip`,
# #143), and every HTTP client of a session built through MDM's TLS setup (`configure_http_client`:
# a system without CA certificates), and a DHT that stops asking a bootstrap node that never
# answers once another one has, and loads its saved IPv6 nodes (#650), and a piece whose hash
# check a pause cuts short queued again instead of lost (#706), until upstream has them
# (ikatson/rqbit); every crate of that repository from the same commit.
librqbit = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-bencode = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-buffers = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-clone-to-owned = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-core = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-dht = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-lsd = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-peer-protocol = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-sha1-wrapper = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-tracker-comms = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
librqbit-upnp = { git = "https://github.com/anefzaoui/rqbit.git", rev = "694291b61fcfd6a77fef7762541b0ef25773ae31" }
ecolor = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
emath = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
epaint = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
epaint_default_fonts = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
egui = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
egui-winit = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
egui_glow = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
egui-wgpu = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
egui_extras = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
eframe = { git = "https://github.com/anefzaoui/egui.git", rev = "4ad60e5365470a6d12166a8075478f8aea44c9f8" }
