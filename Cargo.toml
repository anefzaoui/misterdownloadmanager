[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Ahmed Nefzaoui"]
publish = false

[workspace.dependencies]
mdm-cli = { path = "crates/cli" }
mdm-crash = { path = "crates/crash", default-features = false }
mdm-engine = { path = "crates/engine" }
mdm-ipc = { path = "crates/ipc" }
mdm-labserver = { path = "crates/labserver" }
mdm-mcp = { path = "crates/mcp" }
mdm-tools = { path = "crates/tools" }
mdm-torrent = { path = "crates/torrent" }

# storytold craft-libs (D-003), pinned by commit.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }

# UI: egui 0.37 on storytold's egui/winit forks, the same commits craft-libs uses (see [patch]).
# "clipboard": text boxes cut, copy and paste with the system clipboard (without it egui keeps
# a clipboard of its own, and Ctrl+V / Cmd+V never sees what other programs copied).
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
dirs = "7.0.0"
arboard = { version = "3.7.0", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
open = "5.4.5"

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
http-range-header = "0.4.2"
httpdate = "1.0.3"
# Checksum verification (crates/engine/src/verify.rs).
md-5 = "0.11.0"
sha1 = "0.11.0"
crc32fast = "1.5.3"
# Free space and file system per volume (disk preflight); only the disk part.
sysinfo = { version = "0.40.0", default-features = false, features = ["disk"] }
proptest = "1.12.0"
# HTTP/1.1 only: each engine worker must be one real TCP connection (notes/ENGINE.md §4).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
# FTP and FTPS (crates/engine/src/ftp.rs), with TLS through the rustls and platform verifier
# reqwest uses. "deprecated" is what enables implicit FTPS (ftps://, port 990).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
# The release signatures' RSA and Ed25519 checks (crates/tools/src/openpgp.rs): the crypto
# library rustls brings anyway, with the same features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The MCP server (crates/mcp): the official Rust SDK, stdio only.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
# The lab FTP server's test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
percent-encoding = "2.3.2"
url = { version = "2.5.8", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# Denied everywhere; only crates/app/src/win32.rs (Windows FFI) opts in (D-008).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Whole-program optimisation in one unit: smaller and a little faster programs, for a slower
# release build (#25).
lto = "fat"
codegen-units = 1
# Function names and file:line for crash reports. The debug info doesn't ship: CI turns it into the
# release's symbols zip (tools/installer/symbols.py); Windows keeps it in the .pdb, which no
# download includes, and Linux and macOS strip it from the programs they ship.
debug = "line-tables-only"

# Cold code optimised for size (#25): drawing the windows, fonts, images and icons, file dialogs,
# the clipboard, the command line's parsing, crash reports. What moves the bytes (the engine,
# torrents, TLS, hashing, tokio) and the app itself stay at full speed: with fat LTO the whole
# program is optimised in the app's own unit, at its level.
[profile.release.package.egui]
opt-level = "s"
[profile.release.package.epaint]
opt-level = "s"
[profile.release.package.emath]
opt-level = "s"
[profile.release.package.ecolor]
opt-level = "s"
[profile.release.package.egui_glow]
opt-level = "s"
[profile.release.package.glow]
opt-level = "s"
[profile.release.package.egui-winit]
opt-level = "s"
[profile.release.package.egui_extras]
opt-level = "s"
[profile.release.package.winit]
opt-level = "s"
[profile.release.package.accesskit]
opt-level = "s"
[profile.release.package.accesskit_windows]
opt-level = "s"
[profile.release.package.accesskit_winit]
opt-level = "s"
[profile.release.package.accesskit_consumer]
opt-level = "s"
[profile.release.package.accesskit_unix]
opt-level = "s"
[profile.release.package.accesskit_macos]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.kurbo]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.skrifa]
opt-level = "s"
[profile.release.package.read-fonts]
opt-level = "s"
[profile.release.package.harfrust]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.rfd]
opt-level = "s"
[profile.release.package.arboard]
opt-level = "s"
[profile.release.package.clap]
opt-level = "s"
[profile.release.package.clap_builder]
opt-level = "s"
[profile.release.package.minidump]
opt-level = "s"
[profile.release.package.minidump-processor]
opt-level = "s"
[profile.release.package.minidump-unwind]
opt-level = "s"
[profile.release.package.minidump-common]
opt-level = "s"
[profile.release.package.breakpad-symbols]
opt-level = "s"
[profile.release.package.framehop]
opt-level = "s"
[profile.release.package.minidumper]
opt-level = "s"
[profile.release.package.crash-handler]
opt-level = "s"
[profile.release.package.mdm-crash]
opt-level = "s"
[profile.release.package.zip]
opt-level = "s"

# Hashing is unusably slow unoptimised (a 3 MiB SHA-256 took seconds in debug tests): build
# the checksum crates optimised in dev too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# The app's build script packs the translation catalogs with brotli at its best (crates/app/
# build.rs): unoptimised, that takes minutes instead of seconds. Build scripts are unoptimised
# in release builds too.
[profile.dev.package.brotli]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
# Unpacking them at each start (crates/app/src/i18n.rs), in debug builds too.
[profile.dev.package.brotli-decompressor]
opt-level = 3

# storytold's egui fork (as storytold/craft-libs, D-003) plus two MDM commits on anefzaoui/egui
# (branch mdm-accesskit-windows): every window created hidden gets an AccessKit adapter, so
# screen readers read the dialogs and menus; and a dialog opened while the main window is
# minimized no longer panics (emilk/egui#8470). craft-libs can take the same commits to share
# one egui again.
[patch.crates-io]
ecolor = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
emath = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
epaint = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
epaint_default_fonts = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
egui = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
egui-winit = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
egui_glow = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
egui_extras = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
eframe = { git = "https://github.com/anefzaoui/egui.git", rev = "60b5751250171425d239f6580aaca7fc13d60c64" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
