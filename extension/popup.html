<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <span>Mister Download Manager</span>
  </header>
  <section id="status" class="status" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="status-text"></span>
  </section>
  <a id="fix" class="link" hidden data-i18n="popup_fix" target="_blank" rel="noopener"></a>
  <label class="switch">
    <input id="take" type="checkbox">
    <span data-i18n="popup_take"></span>
  </label>
  <button id="exclude" class="row" hidden></button>
  <p id="excluded" class="note" hidden></p>
  <div class="actions">
    <button id="open" class="accent" data-i18n="popup_open"></button>
    <button id="options" data-i18n="popup_options"></button>
  </div>
  <p class="note" data-i18n="popup_alt"></p>
  <footer>
    <a id="help" class="link" data-i18n="popup_help" target="_blank" rel="noopener"></a>
    <span id="version"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
