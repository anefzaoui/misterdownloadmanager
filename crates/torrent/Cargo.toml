[package]
name = "mdm-torrent"
description = "BitTorrent and magnet downloads for Mister Download Manager (librqbit, D-014)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# 9.1.0 and later: upstream's robustness fixes for what peers send.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
# The TLS setup of the session's HTTP clients (trackers, UPnP), MDM's own: a system without CA
# certificates still starts a session (mdm_engine::tls).
mdm-engine.workspace = true
flate2.workspace = true
# Reading librqbit's saved session (session.json) before it starts (lib.rs).
serde_json.workspace = true
thiserror.workspace = true
# MDM's log: where the session listens (lib.rs).
tracing.workspace = true
tokio.workspace = true
# The blocklist file's URL, and trackers' hosts (lib.rs, trackers.rs).
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The probe example's logs (RUST_LOG).
tracing-subscriber.workspace = true

[lints]
workspace = true