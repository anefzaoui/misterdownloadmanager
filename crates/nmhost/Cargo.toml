[package]
name = "mdm-nmhost"
description = "Browser native messaging host: hands captured downloads to MDM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "misterdownloadmanager-nmhost"
path = "src/main.rs"

[dependencies]
mdm-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
# The date on its lines in MDM's log, written as the app's own (crates/crash/src/logs.rs).
chrono.workspace = true

# Letting the app come to the front (AllowSetForegroundWindow, src/win32.rs).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
