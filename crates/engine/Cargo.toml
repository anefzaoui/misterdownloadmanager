[package]
name = "mdm-engine"
description = "MDM download engine: dynamic segmentation, workers, resume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
craft-atomic.workspace = true
serde_json.workspace = true
futures.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
httpdate.workspace = true
sysinfo.workspace = true
sha2.workspace = true
md-5.workspace = true
sha1.workspace = true
crc32fast.workspace = true
base64.workspace = true
hex.workspace = true
# Proxy auto-config scripts (src/pac.rs): QuickJS, built from C (no bindgen: its bindings come
# with it). Only the language: no module loader, no file or OS access.
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
suppaftp.workspace = true
hickory-resolver.workspace = true
socket2.workspace = true
network-interface.workspace = true
hyper-util.workspace = true
# The client's connector timed, a layer around it (src/server.rs; already in the tree).
tower-layer = "0.3.3"
tower-service = "0.3.3"
# hyper-util's proxy matcher takes an http::Uri (already in the tree through reqwest).
http = "1.5.0"
rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio-rustls.workspace = true

[target.'cfg(windows)'.dependencies]
# Sparse part files only (src/sparse.rs, D-008 amendment).
windows-sys.workspace = true

[dev-dependencies]
mdm-labserver.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
