[package]
name = "mdm-app"
description = "Mister Download Manager, desktop app (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "misterdownloadmanager"
path = "src/main.rs"

[features]
# Update now's end-to-end tests only, never in a release (see mdm-tools): a test key for a fake
# release (MDM_TEST_UPDATE_KEY), `/show update-now` (Update now in the window `/show updates`
# opens), and MDM_TEST_UPDATE_HOLD (seconds the update waits before it's put in place, to see and
# close the window meanwhile). tools/lab/update runs them.
test-update = ["mdm-tools/test-update"]

[dependencies]
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
craft-atomic.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
craft-i18n.workspace = true
# misterdownloadmanager-cli's commands: its launcher runs this program for them (main.rs).
mdm-cli.workspace = true
mdm-engine.workspace = true
mdm-extract.workspace = true
mdm-geo.workspace = true
mdm-ipc.workspace = true
# The remote control (#141): a paired phone adds and controls downloads over the local network.
mdm-remote.workspace = true
mdm-tools.workspace = true
mdm-torrent.workspace = true
open.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
url.workspace = true
percent-encoding.workspace = true
rfd = "0.17.2"
# Options → Remote → Pair a device's QR code of the address (#141; Nayuki's, no dependencies).
qrcodegen = "1.8.0"
# Line breaks between characters keep a letter and its marks together (Thai, Khmer, Indic).
unicode-segmentation = "1.13.3"
# Crash and freeze reports: the monitor, minidumps, symbolicated stacks, release logs.
mdm-crash.workspace = true
mdm-debrid.workspace = true
tracing.workspace = true
# Unpacks the translation catalogs (i18n.rs, packed by build.rs); already in the tree through
# reqwest's brotli support.
brotli-decompressor = "6.2.0"
# RSS feeds (rss.rs): reading them (no DTDs), and the rules' regular expressions; both already
# in the tree (resvg's SVG, the engine's dependencies).
roxmltree = "0.20.0"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Windows can draw with Direct3D 12 instead of OpenGL (#89, renderer.rs): eframe's wgpu renderer
# with wgpu's Direct3D 12 backend only (no Vulkan, no GL: OpenGL stays eframe's glow).
eframe = { workspace = true, features = ["wgpu_no_default_features"] }
# Cargo.lock keeps gpu-allocator (wgpu-hal's) on wgpu-hal's windows 0.62: its range allows 0.61 too,
# which win32job uses, and wgpu-hal doesn't build with that one.
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl"] }
# Drag the downloaded file out of Download complete (OLE drag and drop).
drag = "2.1.1"
raw-window-handle = "0.6"
# Latin, Greek and Cyrillic text drawn by DirectWrite as Windows' classic controls draw it
# (win32.rs `text_rasterizer`): its COM interfaces, which windows-sys doesn't have. The windows
# 0.62 wgpu-hal already builds.
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_DirectWrite"] }

# The notification-area icon and its menu (tray.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

# Linux: windows on Wayland and X11; the tray over D-Bus (StatusNotifierItem:
# KDE, and GNOME with its AppIndicator extension), no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
# View → Draw with → Vulkan (#206, renderer.rs): eframe's wgpu renderer with wgpu's Vulkan backend
# only (Wayland and X11 windows; no GL backend: OpenGL stays eframe's glow, and the default).
eframe = { workspace = true, features = ["wayland", "x11", "wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "wgsl"] }
# Choosing X11 (XWayland) over Wayland when both are there (unix.rs prefer_x11, #50); the
# workspace's patched winit, as eframe's.
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# The desktop's light or dark preference from the freedesktop portal (unix.rs); already in the
# tree through the tray (ksni) and AccessKit, with the same features.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# The settings daemon's theme name (XSETTINGS) when the portal can't say dark or light (unix.rs,
# #156); already in the tree through winit. Its pure-Rust connection, no extension.
x11rb = { version = "0.13.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder's file icons (unix.rs file_icon); already in the tree through winit and rfd.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }
# View → Draw with → Metal (#206, renderer.rs): eframe's wgpu renderer with wgpu's Metal backend
# only; OpenGL stays eframe's glow, and the default. egui-wgpu's fix for windows that jitter while
# they are resized (Core Animation presenting with the resize), as upstream egui turns it on.
eframe = { workspace = true, features = ["wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["metal", "wgsl"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["macos-window-resize-jitter-fix"] }
# Sign-in secrets in the login keychain (unix.rs, #44); already in the tree through rustls's
# platform verifier.
security-framework = "3.7.0"

# Crash reports on Linux and macOS: thread and process ids, signals (unix.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[build-dependencies]
# Packs the translation catalogs (build.rs).
brotli = "9.1.1"

[target.'cfg(windows)'.build-dependencies]
# Embeds the exe icon and version info (build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
# secrets.rs's test that no secret reaches the log.
tracing-subscriber.workspace = true
# The command line's tests (tests/cli_*.rs) download from it.
mdm-labserver.workspace = true

[lints]
workspace = true
