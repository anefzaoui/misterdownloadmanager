[package]
name = "mdm-app"
description = "Mister Download Manager, desktop app (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "misterdownloadmanager"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
craft-atomic.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
craft-i18n.workspace = true
mdm-engine.workspace = true
mdm-ipc.workspace = true
mdm-tools.workspace = true
mdm-torrent.workspace = true
open.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
percent-encoding.workspace = true
rfd = "0.17.2"
# Line breaks between characters keep a letter and its marks together (Thai, Khmer, Indic).
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Drag the downloaded file out of Download complete (OLE drag and drop).
drag = "2.1.1"
raw-window-handle = "0.6"

# The notification-area icon and its menu (tray.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

# Linux (experimental): windows on Wayland and X11; the tray over D-Bus (StatusNotifierItem:
# KDE, and GNOME with its AppIndicator extension), no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the exe icon and version info (build.rs).
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
