# Aqua: one of Mister Download Manager's built-in themes, after Mac OS X's look (Leopard, 2007):
# the feel of its colours and shapes, drawn by MDM (no picture, font or icon of Apple's), with an
# icon set drawn for MDM in that manner.
# It is also an example of a theme file: seeds for the colours, the roles Mac OS X sets apart by
# hand, its controls (gel buttons round at the ends, the default one blue, glossy check boxes, a
# blue gel progress bar, a focus ring), a grey title bar on Windows and an icon set. Its round
# title-bar buttons are graphite, Mac OS X's quieter appearance. Leopard had no dark mode: the
# dark side is the same look at night.

name = "Aqua"
icon-set = "aqua"
icons = "color"

[controls]
field-focus = "ring"
check = "aqua"
button = "aqua"
progress = "gloss"
scroll = "classic"
focus = "ring"
caption = "aqua"

[sizes]
radius = 3
"radius.part" = 3
"radius.check" = 3
"radius.flyout" = 6
"radius.menu-item" = 0
"radius.popup" = 4
"radius.egui" = 3

[seeds.light]
background = "#e8e8e8"
surface = "#ffffff"
header = "#ffffff"
text = "#000000"
accent = "#3875d7"
selection = "#3875d7"
error = "#c42b1c"
warning = "#9d5d00"
success = "#1e7f2e"

[seeds.dark]
background = "#2b2b2b"
surface = "#1e1e1e"
header = "#1e1e1e"
text = "#ffffff"
accent = "#5a9cf5"
selection = "#2c5aa0"
error = "#ff8f80"
warning = "#f7c35c"
success = "#6ccb5f"

[light]
# Mac OS X's push buttons: a white-grey gel, round at the ends, a grey edge; blue pressed. The
# default button is the accent's blue gel, its label dark.
gloss = "#ffffff"
button = "#d4d4d4"
"button.hot" = "#cbcbcb"
"button.pressed" = "#8db2ea"
"button.border" = "#8b8b8b"
"button.bottom" = "#8b8b8b"
"button.text" = "#000000"
"button.text.pressed" = "#000000"
"button.default.border" = "#2c64b8"
"button.default.bottom" = "#2c64b8"
"button.accent" = "#5c9cf0"
"button.accent.hot" = "#4e90ea"
"button.accent.pressed" = "#3a7bdc"
"button.accent.bottom" = "#2c64b8"
"button.accent.text" = "#000000"
"button.accent.text.pressed" = "#000000"
"button.disabled" = "#ececec"
"button.disabled.border" = "#bdbdbd"
# Text boxes: a grey edge, a blue ring when focused.
"field.border" = "#9a9a9a"
"field.bottom" = "#9a9a9a"
# Check boxes and radios: grey gel, the accent's blue gel when checked, a dark tick.
check = "#e0e0e0"
"check.hot" = "#d4d4d4"
"check.pressed" = "#c4c4c4"
"check.border" = "#8b8b8b"
"check.border.hot" = "#7a7a7a"
"check.border.pressed" = "#6a6a6a"
"check.border.disabled" = "#bdbdbd"
"check.on" = "#4c8ff0"
"check.on.hot" = "#4285ea"
"check.on.pressed" = "#2f6fd6"
"check.on.disabled" = "#c4c4c4"
"check.mark" = "#10203a"
# The keyboard focus: a blue ring, strong enough for 3:1 on the window and the boxes.
"focus.ring" = "#3a7ad6"
# A blue gel progress bar.
"progress.bar" = "#4a8ee8"
"meter.fill" = "#4a8ee8"
"meter.track" = "#f0f0f0"
"meter.edge" = "#9a9a9a"
menu = "#f6f6f6"
"menu.item" = "#f6f6f6"
"menu.hot" = "#cddcf6"
"menu.border" = "#b5b5b5"
# The menu bar goes on from the title bar's grey.
menubar = "#cbcbcb"
"menubar.bottom" = "#cbcbcb"
"menubar.hot" = "#b8c9e8"
"menubar.open" = "#a9bfe6"
"menubar.line" = "#a5a5a5"
"toolbar.hot" = "#d7d7d7"
"toolbar.hot.faint" = "#e0e0e0"
"toolbar.hot.edge" = "#a8a8a8"
"toolbar.hot.border" = "#a8a8a8"
"toolbar.pressed" = "#c4c4c4"
"scroll.track" = "#efefef"
"scroll.corner" = "#e8e8e8"
"scroll.thumb" = "#7ea6e0"
"scroll.thumb.hot" = "#6595da"
"scroll.thumb.pressed" = "#4c82d0"
header = "#f4f4f4"
"header.sep" = "#cfcfcf"
"header.sorted" = "#d5e3f7"
# The title bar: light grey falling to a deeper grey, the title centred, pressed into it.
# Its round buttons graphite, their glyphs shown under the pointer; Close then red.
caption = "#cbcbcb"
"caption.inactive" = "#e3e3e3"
