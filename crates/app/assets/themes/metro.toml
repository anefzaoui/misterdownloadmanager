# Metro: one of Mister Download Manager's built-in themes, after Windows 8's flat desktop look
# (colours and shapes only: nothing of Microsoft's artwork but its MIT-licensed Fluent icons).
# It is also an example of a theme file: seeds for the colours, a few roles set by hand, square
# corners, the controls' Windows 8 shapes, a drawn title bar on Windows and an icon set.

name = "Metro"
icon-set = "metro"
icons = "mono"

[controls]
field-focus = "border"
check = "square"
progress = "bar"
scroll = "classic"
caption = "metro"

[sizes]
radius = 0
"radius.part" = 0
"radius.check" = 0
"radius.flyout" = 0
"radius.menu-item" = 0
"radius.popup" = 0
"radius.egui" = 0

[seeds.light]
background = "#f0f0f0"
surface = "#ffffff"
header = "#ffffff"
text = "#000000"
accent = "#2672ec"
selection = "#cce8ff"
error = "#c42b1c"
warning = "#9d5d00"
success = "#107c10"

[seeds.dark]
background = "#1f1f1f"
surface = "#2b2b2b"
header = "#1f1f1f"
text = "#ffffff"
accent = "#1ba1e2"
selection = "#1d4f73"
error = "#ff99a4"
warning = "#fce100"
success = "#6ccb5f"

[light]
# Windows 8's flat buttons: a grey face, a darker edge all round, light blue under the pointer.
button = "#e1e1e1"
"button.border" = "#adadad"
"button.bottom" = "#adadad"
"button.hot" = "#e5f1fb"
"button.pressed" = "#cce4f7"
"button.default.border" = "#2672ec"
"button.default.bottom" = "#2672ec"
"progress.bar" = "#06b025"
"meter.track" = "#e6e6e6"
"meter.edge" = "#bcbcbc"
# Flat scroll bars, their arrows always shown.
"scroll.track" = "#f0f0f0"
"scroll.corner" = "#f0f0f0"
"scroll.thumb" = "#a6a6a6"
"scroll.thumb.hot" = "#858585"
"scroll.thumb.pressed" = "#606060"
# The title bar in the window colour, its text white.
caption = "#2672ec"
"caption.text" = "#ffffff"
"caption.text.inactive" = "#c3d8fa"
"caption.hot" = "#ffffff33"
"caption.pressed" = "#00000033"

[dark]
button = "#333333"
"button.border" = "#5a5a5a"
"button.bottom" = "#5a5a5a"
"button.hot" = "#1d4f73"
"button.pressed" = "#16405e"
"progress.bar" = "#06b025"
"scroll.track" = "#2b2b2b"
"scroll.corner" = "#2b2b2b"
"scroll.thumb" = "#6e6e6e"
"scroll.thumb.hot" = "#8e8e8e"
"scroll.thumb.pressed" = "#b0b0b0"
caption = "#1f1f1f"
"caption.text" = "#ffffff"
"caption.text.inactive" = "#8a8a8a"
"caption.hot" = "#ffffff26"
"caption.pressed" = "#ffffff14"
