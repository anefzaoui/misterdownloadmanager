menubar = "#1f2533"
"menubar.bottom" = "#1f2533"
"menubar.hot" = "#2d4170"
"menubar.open" = "#2d4170"
"menubar.line" = "#121620"
"toolbar.hot" = "#2d4170"
"toolbar.hot.faint" = "#232f48"
"toolbar.hot.edge" = "#4d7fe0"
