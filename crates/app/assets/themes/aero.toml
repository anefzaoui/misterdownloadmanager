# Aero: one of Mister Download Manager's built-in themes, after Windows 7's look (2009): the feel
# of its colours and shapes, drawn by MDM (no picture, font or icon of Microsoft's), with an icon
# set drawn for MDM in that manner.
# It is also an example of a theme file: seeds for the colours, the roles Windows 7 sets apart by
# hand, its controls (glossy buttons in two halves that turn light blue under the pointer, quiet
# check boxes, a glossy green progress bar), a glassy title bar on Windows and an icon set.

name = "Aero"
icon-set = "aero"
icons = "color"

[controls]
field-focus = "border"
check = "aero"
button = "aero"
progress = "gloss"
scroll = "classic"
focus = "dotted"
caption = "aero"

[sizes]
radius = 2
"radius.button" = 3
"radius.part" = 2
"radius.check" = 0
"radius.flyout" = 4
"radius.menu-item" = 3
"radius.popup" = 3
"radius.egui" = 2

[seeds.light]
background = "#f0f0f0"
surface = "#ffffff"
header = "#ffffff"
text = "#000000"
accent = "#3274c2"
selection = "#cce8ff"
error = "#c42b1c"
warning = "#9d5d00"
success = "#0f7b0f"

[seeds.dark]
background = "#22272e"
surface = "#1a1e24"
header = "#1a1e24"
text = "#ffffff"
accent = "#5aa4e6"
selection = "#25476b"
error = "#ff8f8f"
warning = "#f7c35c"
success = "#6ccb5f"

[light]
# Windows 7's buttons: a glossy grey face, lighter in its top half, a grey edge; light blue
# under the pointer and deeper blue pressed, the edge then the accent's.
gloss = "#ffffff"
button = "#cfcfcf"
"button.hot" = "#a9daf6"
"button.pressed" = "#6cb5de"
"button.border" = "#707070"
"button.bottom" = "#707070"
"button.default.border" = "#3c7fb1"
"button.default.bottom" = "#3c7fb1"
"button.text" = "#000000"
"button.text.pressed" = "#000000"
"button.disabled" = "#f4f4f4"
"button.disabled.border" = "#adb2b5"
# Text boxes: a grey edge, the accent's when focused.
"field.border" = "#abadb3"
"field.bottom" = "#abadb3"
# Check boxes and radios: a grey edge round a shaded square, light blue under the pointer; a
# dark blue tick.
check = "#f4f4f4"
"check.hot" = "#def4fd"
"check.pressed" = "#c2e4f6"
"check.border" = "#8e8f8f"
"check.border.hot" = "#3c7fb1"
"check.border.pressed" = "#2c628b"
"check.border.disabled" = "#bcbcbc"
"check.on" = "#3b6fb6"
"check.on.hot" = "#4a85d1"
"check.on.pressed" = "#2f5f9e"
"check.on.disabled" = "#bcbcbc"
"check.mark" = "#25356e"
# A glossy green progress bar on a light track.
"progress.bar" = "#06b025"
"meter.fill" = "#06b025"
"meter.track" = "#e6e6e6"
"meter.edge" = "#a8a8a8"
"focus.ring" = "#000000"
# Menus: a light blue item under the pointer, rounded.
menu = "#f5f5f5"
"menu.item" = "#f5f5f5"
"menu.hot" = "#dce9f8"
"menu.border" = "#979797"
menubar = "#e3ecf7"
"menubar.bottom" = "#e1e9f5"
"menubar.hot" = "#cfe2f8"
"menubar.open" = "#bed8f6"
"menubar.line" = "#c5d3e6"
"toolbar.hot" = "#dceaf9"
"toolbar.hot.faint" = "#edf4fc"
"toolbar.hot.edge" = "#7da2ce"
"toolbar.hot.border" = "#7da2ce"
"toolbar.pressed" = "#c2dbf6"
"scroll.track" = "#f0f0f0"
"scroll.corner" = "#f0f0f0"
"scroll.thumb" = "#a7a9b0"
"scroll.thumb.hot" = "#7fb0dc"
"scroll.thumb.pressed" = "#5a97cc"
header = "#ffffff"
"header.sep" = "#dde3ea"
"header.sorted" = "#f2f7fc"
# The title bar: light blue glass, its top half brighter; the title dark on a soft glow.
# Minimize and Maximize a deeper glass, Close red, their glyphs white with a shadow.
caption = "#9cc0e6"
"caption.inactive" = "#cddbea"
"caption.text" = "#000000"
"caption.text.inactive" = "#5e6a78"
"caption.button" = "#86aedb"
"caption.close" = "#c74343"
"caption.close.text" = "#ffffff"

