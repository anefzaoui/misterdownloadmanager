[package]
name = "mdm-labserver"
description = "HTTP Range test server with request log and fault injection (tests + behaviour lab)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "labserver"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
http-range-header.workspace = true
httpdate.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
tokio.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# The HTTPS lab (`Config::tls`): its connections served by hand, axum's own features.
hyper-util = { workspace = true, features = ["server", "http1", "tokio", "service"] }
url.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
