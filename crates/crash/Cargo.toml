[package]
name = "mdm-crash"
description = "Crash and freeze reports: the monitor process, minidumps, symbolicated stacks, logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Out-of-process minidumps (Embark Studios, as Firefox and Sentry do it): the crashed process only
# asks; a monitor process writes the dump of every thread.
minidumper = "0.11"
crash-handler = "0.8"
# Mozilla's rust-minidump: stacks from a dump, symbols from Breakpad .sym files (release symbols,
# made in CI) or from the native debug info beside a program built from source.
minidump = "0.27"
minidump-processor = "0.27"
minidump-unwind = { version = "0.27", features = ["debuginfo"] }
breakpad-symbols = "0.27"
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true

# examples/crashy.rs (the end-to-end test's crashing program) names its own threads.
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[lints]
workspace = true
