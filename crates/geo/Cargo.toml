[package]
name = "mdm-geo"
description = "Where a download's server is (#140): an IP address's country, from DB-IP's IP to Country Lite (CC BY 4.0) shipped with MDM, looked up on this computer only; and the countries' flags"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The table's xz (already in the tree for archives, mdm-extract).
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }

[dev-dependencies]
# examples/flag_atlas.rs: the flags drawn into one picture (both already in the tree).
resvg = { version = "0.45", default-features = false }
png = "0.18"

[lints]
workspace = true
