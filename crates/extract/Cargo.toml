[package]
name = "mdm-extract"
description = "Safe archive extraction: zip, 7z, tar (gz, xz), single gz/xz, and RAR through an external 7-Zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# zip's Deflate is already in the shipped app (mdm-crash, mdm-tools); Deflate64 (Explorer's zips
# over 2 GB) and WinZip AES are small additions.
zip = { version = "9.1.3", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }
# 7z, decoder only: LZMA/LZMA2, BCJ, Deflate, AES-256; no encoder, no zstd (C).
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "deflate"] }
tar = { version = "0.4.46", default-features = false }
flate2.workspace = true
# The xz decoder, the same version sevenz-rust2 uses (one copy).
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "optimization"] }
mdm-engine.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Tests make their own 7z archives (dev features don't reach the release build).
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "compress", "util"] }

[lints]
workspace = true
