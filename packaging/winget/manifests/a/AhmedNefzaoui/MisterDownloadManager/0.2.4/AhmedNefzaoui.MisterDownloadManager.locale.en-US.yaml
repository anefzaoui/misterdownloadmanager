ShortDescription: Free, open-source download manager with several connections per file, resume, browser integration, videos and torrents.
Description: |-
  Mister Download Manager speeds up downloads by fetching parts of a file at the same time, and resumes them after a crash, a restart or a dropped connection.
  It catches downloads from Firefox, Chrome, Edge and Brave, downloads videos from web pages and torrents and magnet links, and runs queues on a schedule.
  It has a command-line tool, a local API and an MCP server for AI assistants, dark mode, 86 languages, and works from the keyboard and with screen readers.
  No ads, no trial, no account.
