<!doctype html>
<!-- A Vimeo page of many clips playing in place (a feed's cards), reduced to what names each clip
     (our own sample: no real account or video). -->
<html><head><meta charset="utf-8"><meta name="mdm-page" content="https://vimeo.com/watch"><title>Vimeo</title><link rel="stylesheet" href="feeds.css"></head>
<body>
<main>
  <section class="feed">
    <div class="clip-card"><div class="player"><video data-expect="https://vimeo.com/900000001"></video></div>
      <a href="/900000001">A first sample clip</a> <a href="/samplecreator">Sample Creator</a></div>
    <div class="clip-card"><div class="player"><video data-expect="https://vimeo.com/900000002/0123456789"></video></div>
      <a href="https://vimeo.com/900000002/0123456789">An unlisted sample clip</a></div>
    <div class="clip-card"><div class="player"><video data-expect="https://vimeo.com/900000003"></video></div>
      <a href="/channels/samplechannel/900000003">A channel's sample clip</a></div>
  </section>
</main>
</body></html>
