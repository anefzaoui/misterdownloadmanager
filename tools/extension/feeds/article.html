<!doctype html>
<!-- A site the extension knows nothing of: an article with two players and no post around them.
     The page is still theirs to yt-dlp (its generic reader), as before (our own sample). -->
<html><head><meta charset="utf-8"><meta name="mdm-page" content="http://news.example.test/2026/11/a-sample-story"><title>A sample story</title><link rel="stylesheet" href="feeds.css"></head>
<body>
<article><h1>A sample story</h1>
  <p>Some words. <a href="/about">About us</a></p>
  <figure><video data-expect="page"></video><figcaption>A first sample clip</figcaption></figure>
  <figure><video data-expect="page"></video><figcaption>A second sample clip</figcaption></figure>
</article>
</body></html>
