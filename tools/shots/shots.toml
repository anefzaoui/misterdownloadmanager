# The help pages' pictures (docs/images/help/), one entry each. tools/shots/make.py takes them
# all again in one go, light and dark; `make.py check` keeps this list, the pages and the files
# in step. See tools/shots/README.md.
#
#   id       the file: docs/images/help/<id>.webp (light) and <id>-dark.webp
#   page     the docs page it is on, and `under` the heading it sits under; or a website file
#            (website/...) that lists it for the site's own pages
#   take     what to open, as tools/lab/docs-shots.ps1 -Show takes it: a /show argument
#            ("options:connection"), "@main", "@menu:<show argument>" (a menu, over the main
#            window), "@download:<lab server path>" (Download File Info, as a browser hands a
#            download over), "@complete:<path>" (Download complete), "@torrent" (Add torrent for
#            tools/lab/Open Movie Night.torrent); "a+b" runs /show a first ("theme:breeze+@main").
#            Shots with the same take share one capture.
#   from     instead of take: a picture already in the repository (the browser's, made by
#            tools/readme/browser-shots.mjs), and from_dark its night version if there is one
#   crop     what to keep: [x, y, w, h] in the window's pixels (w or h 0: to the edge), or
#            { around = ["control", ...], pad = 16 } the controls' area and a margin (an edge
#            within `snap`, 24 px, is kept whole). The whole window when absent.
#   ring     controls to ring (by their accessible name, "Button:OK" by type too, "OK#2" the
#            second of the name, or [x, y, w, h])
#   marks    numbered markers: a control, or { at = control, n = 3, side = "left" | "right" |
#            "top" | "bottom" | "center" | "corner" }; numbered 1, 2... unless n says
#   lossy    a quality (90) for a photograph, such as a video in the browser: lossy WebP there,
#            lossless for every window
#   alt      what the picture shows, for whoever can't see it
#   caption  the line under it (in a step strip: what to do)
# The page carries alt and caption as Markdown (`make.py snippet <id>` prints it); the site's
# translations (tools/website/translate_site.py) translate them with the page.

