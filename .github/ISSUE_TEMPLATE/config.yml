    url: https://misterdownloadmanager.com/security.html
    about: Report it privately, not as an issue.
  - name: Help and questions
    url: https://misterdownloadmanager.com/help/
    about: The user guide, tutorials and troubleshooting; the FAQ is at misterdownloadmanager.com/faq/.
