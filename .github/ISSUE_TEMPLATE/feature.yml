name: Feature idea
description: Something MDM should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What MDM should do, in your own words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      description: Where you use MDM.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
  - type: input
    id: elsewhere
    attributes:
      label: Seen it elsewhere?
      description: Another program that does it, if any.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send it
      options:
        - label: I looked through the [open issues](https://github.com/anefzaoui/misterdownloadmanager/issues) and this idea isn't there yet.
          required: true
