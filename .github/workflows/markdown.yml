# The website's Markdown for AI tools and agents (website/markdown/: a Cloudflare Worker, and the
# build's page-to-Markdown conversion, tools/website/pagemd.py): their tests, on every change to
# them. No packages and no Cloudflare account needed. Deploying is by hand (its README.md).
name: Website Markdown

on:
  push:
    branches: [main]
    paths:
      - "website/markdown/**"
      - "tools/website/pagemd.py"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths:
      - "website/markdown/**"
      - "tools/website/pagemd.py"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test the Worker
        working-directory: website/markdown
        run: node --test test/markdown.test.mjs
      - name: Test the build's conversion
        working-directory: website/markdown
        run: python -I -W error -m unittest discover -s test -p "test_*.py"
