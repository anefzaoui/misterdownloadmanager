# Builds the downloads: Windows (tools/installer/build.ps1: installer, portable zip, plain zip)
# for x64, ARM64 and 32-bit (x86), the browser extension (tools/extension/pack.ps1: the Chromium
# zip; Firefox's add-on goes to addons.mozilla.org only), Linux for x86-64 and ARM64
# (build-linux.sh: AppImage, tar.gz, .deb, .rpm) and, experimental and not yet tested by us,
# macOS (build-macos.sh: a .dmg for Apple Silicon, one for Intel; named "-experimental"). Each
# build's programs are tried on the machine that built them first (tools/installer/smoke.py): the
# processor they are for, and a download.
# - A pushed tag vX.Y.Z (matching Cargo.toml's version) publishes a GitHub release with them and
#   SHA256SUMS.txt, its notes from CHANGELOG.md (Help -> Check for updates sees it at once). The
#   release waits for x64 Windows and the extensions: a failed build of another processor or
#   system leaves its files out.
# - Run by hand (Actions -> Release -> Run workflow) it only builds and keeps them as artifacts:
#   nothing is published, and nothing is sent to addons.mozilla.org or the Chrome Web Store.
# - Windows, when the SIGNPATH_API_TOKEN secret is set: code-signed through SignPath (signpath.io)
#   before anything is published. Job `windows` builds and tests each processor's programs;
#   `windows-to-sign` puts all of them, with Inno Setup's uninstaller for each, in one artifact;
#   `sign-windows` sends it to SignPath as one signing request and waits for it; `windows-installers`
#   makes the installers and zips from the signed files; `sign-windows-installers` sends the
#   installers as a second request; `publish` checks every program is signed, then makes
#   SHA256SUMS.txt (of the signed files) and signs it. Two requests per release, because each
#   installer contains the signed programs. A pushed tag uses SignPath's release-signing policy,
#   each request waiting (hours if need be) for the maintainer's approval in SignPath; a run by
#   hand uses its test-signing. Without the token (a fork), or run by hand with "unsigned", the
#   Windows files are built as before: a PFX certificate if one is set, else unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build Windows without SignPath (as a fork does)
        type: boolean
        default: false

# Read-only for every job; a job that needs more says so in its own block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  geo:
    # Where a download's server is (#140): this month's IP-to-country table (DB-IP's IP to Country
    # Lite, CC BY 4.0) for every build. A failed download keeps the committed one, with a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: IP-to-country table
        run: python3 tools/geo/build.py --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-data
          path: crates/geo/data/*
          retention-days: 7


  signing:
    # Whether, and with which of SignPath's signing policies, the Windows files are signed
    # (signpath.io; .signpath/artifact-configuration.xml says what it signs and checks):
    # - release-signing (the release certificate; each request waits for the maintainer's
    #   approval in SignPath) only for a pushed tag v* on this repository;
    # - test-signing (SignPath's test certificate, no approval) for a run by hand;
    # - none without the SIGNPATH_API_TOKEN secret (a fork, a copy of the repository) or when the
    #   run by hand asks for an unsigned build: then the Windows files are built as before (the
    #   PFX certificate below if there is one, else unsigned).
    runs-on: ubuntu-latest
    outputs:
      policy: ${{ steps.policy.outputs.policy }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Signing policy
        id: policy
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          UNSIGNED: ${{ inputs.unsigned }}
        run: |
          v=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REPOSITORY" != "anefzaoui/misterdownloadmanager" ]; then
            echo "::warning::Not MDM's own repository: the Windows files are built without SignPath."
            exit 0
          fi
          if [ "$UNSIGNED" = "true" ]; then
            echo "::warning::Asked for an unsigned build: the Windows files are built without SignPath."
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::SIGNPATH_API_TOKEN isn't set: the Windows files are built without SignPath (unsigned, unless a PFX certificate is set)."
            exit 0
          fi
          # Every signed file must say it is this version (the artifact configuration's
          # product-version): the programs (tools/build/version_info.rs) and the installer and its
          # uninstaller (mdm.iss) take it from Cargo.toml. The installer and its uninstaller carry
          # it padded to Inno Setup's fixed width, which the configuration spells out for a
          # 5-character version.
          if [ "${#v}" -ne 5 ]; then
            echo "version $v is not 5 characters: update the padding in .signpath/artifact-configuration.xml (and SignPath's copy) first" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "policy=release-signing" >> "$GITHUB_OUTPUT"
            echo "Release build $GITHUB_REF at $GITHUB_SHA: SignPath's release-signing, approved in SignPath."
          else
            echo "policy=test-signing" >> "$GITHUB_OUTPUT"
            echo "Not a release ($GITHUB_EVENT_NAME, $GITHUB_REF): SignPath's test-signing."
          fi

  windows:
    # One build per processor, each on a runner of its own: x64 and 32-bit on GitHub's x64 Windows
    # (32-bit programs run there too, for the tests), ARM64 on its Windows on ARM.
    # With SignPath, this job only builds and tests the programs (and their symbols); the jobs
    # after it get them signed and make the installers and zips from the signed ones.
    name: windows-${{ matrix.arch }}
    needs: [geo, signing]
    # A cold build with its tests takes about 45 minutes; a stuck or long-queued runner (the ARM
    # ones) is cut off instead of holding the release for GitHub's 6 hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - arch: x86
            runner: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-data
          path: crates/geo/data

      # Windows on ARM's runner may come without rustup: rustup's own installer, checked.
      - name: rustup
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) { exit 0 }
          $url = "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe"
          $exe = "$env:RUNNER_TEMP\rustup-init.exe"
          Invoke-WebRequest $url -OutFile $exe
          $want = (Invoke-WebRequest "$url.sha256").Content.Split()[0]
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $want) { throw "rustup-init's checksum doesn't match" }
          & $exe -y --default-toolchain none --profile minimal
          if ($LASTEXITCODE) { throw "rustup-init failed" }
          "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but Cargo.toml says $v" }

      # BoringSSL, under the browser-like connection (#668, crates/engine/src/browserlike.rs), and
      # AWS-LC are built with NASM for x64 and 32-bit Windows; the runner has CMake and LLVM's
      # libclang already.
      - name: NASM
        if: runner.arch != 'ARM64'
        # nasm.us at a pinned SHA256, Chocolatey's feed only if that download fails.
        uses: ./.github/actions/nasm

      # Windows on ARM: LLVM (clang and libclang) for their assembly and bindings there.
      - name: LLVM
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) {
            choco install llvm --no-progress -y
          }
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Inno Setup
        if: needs.signing.outputs.policy == ''
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # A certificate of our own (a PFX), used when SignPath isn't.
      - name: Code-signing certificate
        id: cert
        if: needs.signing.outputs.policy == ''
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No certificate: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "command=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:PASSWORD`" `$f" >> $env:GITHUB_OUTPUT

      - name: Installer and portable zip
        if: needs.signing.outputs.policy == ''
        shell: pwsh
        env:
          MDM_SIGN_COMMAND: ${{ steps.cert.outputs.command }}
        run: ./tools/installer/build.ps1 -Arch ${{ matrix.arch }}

      - name: Programs
        if: needs.signing.outputs.policy != ''
        shell: pwsh
        run: ./tools/installer/build.ps1 -Arch ${{ matrix.arch }} -BuildOnly

      # The programs on the machine that built them: for this processor, and a download works.
      - name: Smoke test
        run: python tools/installer/smoke.py target/${{ matrix.target }}/release ${{ matrix.arch }}

      # Crash reports: the release's symbols (dump_syms reads each program's .pdb beside it; no
      # download includes the .pdb files themselves). Signing doesn't change the debug ids crash
      # reports match.
      - name: Symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $exes = "misterdownloadmanager", "misterdownloadmanager-nmhost", "misterdownloadmanager-cli", "misterdownloadmanager-mcp" |
            ForEach-Object { "target/${{ matrix.target }}/release/$_.exe" }
          python tools/installer/symbols.py windows-${{ matrix.arch }} $v target/dist @exes
          if ($LASTEXITCODE) { throw "symbols failed" }

      # x64's under the name it always had ("windows"), the others' with their processor.
      - if: needs.signing.outputs.policy == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch == 'x64' && 'windows' || format('windows-{0}', matrix.arch) }}
          path: target/dist/*

      # With SignPath: the symbols for the release, and the unsigned programs for the next job
      # only ("signing-*": deleted once used; publish refuses to go on while one is left).
      - if: needs.signing.outputs.policy != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}-symbols
          path: target/dist/MisterDownloadManager-${{ needs.signing.outputs.version }}-symbols-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - if: needs.signing.outputs.policy != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-windows-${{ matrix.arch }}-programs
          path: |
            target/${{ matrix.target }}/release/misterdownloadmanager.exe
            target/${{ matrix.target }}/release/misterdownloadmanager-nmhost.exe
            target/${{ matrix.target }}/release/misterdownloadmanager-cli.exe
            target/${{ matrix.target }}/release/misterdownloadmanager-mcp.exe
          if-no-files-found: error
          retention-days: 1

  windows-to-sign:
    # With SignPath: every processor's programs and Inno Setup's uninstaller for each, in ONE
    # artifact (x64/, arm64/, x86/), so a release asks SignPath for one signing request (one
    # approval) for all of them. The uninstaller is made here, on the same kind of runner as the
    # installers later (windows-installers), so both use the same Inno Setup. x64 must be there;
    # a processor whose build failed is left out, as from the release.
    needs: [signing, windows]
    if: >-
      ${{ !cancelled() && needs.signing.result == 'success' && needs.signing.outputs.policy != '' &&
      needs.windows.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # deletes the programs' artifacts once gathered
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-windows-*-programs
          path: ${{ runner.temp }}/built

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: The files to sign
        shell: pwsh
        run: |
          $targets = [ordered]@{ x64 = "x86_64-pc-windows-msvc"; arm64 = "aarch64-pc-windows-msvc"; x86 = "i686-pc-windows-msvc" }
          if (-not (Test-Path "$env:RUNNER_TEMP/built/signing-windows-x64-programs")) { throw "x64 Windows' programs aren't there: nothing to sign" }
          foreach ($arch in $targets.Keys) {
            $built = "$env:RUNNER_TEMP/built/signing-windows-$arch-programs"
            if (-not (Test-Path $built)) { "::warning::$arch Windows' programs aren't there (its build failed): left out"; continue }
            $bin = "target/$($targets[$arch])/release"
            New-Item -ItemType Directory -Force $bin | Out-Null
            Copy-Item "$built/*.exe" $bin
            ./tools/installer/build.ps1 -Arch $arch -NoBuild -ToSign "$env:RUNNER_TEMP/to-sign/$arch"
          }

      - name: Upload the files to sign
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-windows-programs
          path: ${{ runner.temp }}/to-sign/
          if-no-files-found: error
          retention-days: 1

      - name: The programs' artifacts deleted
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = "signing-windows-x64-programs", "signing-windows-arm64-programs", "signing-windows-x86-programs"
          $all = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.name)"'
          foreach ($line in $all) {
            $id, $name = $line -split " ", 2
            if ($names -contains $name) { gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; if ($LASTEXITCODE) { throw "$name couldn't be deleted" } }
          }

  sign-windows:
    # The one signing request for the programs and uninstallers (request 1 of 2 per release): see
    # .github/actions/signpath. A release-signing request waits for the maintainer's approval, up
    # to five and a half hours; denied, failed or not approved in time, the run stops here and
    # nothing is published.
    needs: [signing, windows-to-sign]
    if: ${{ !cancelled() && needs.windows-to-sign.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write # SignPath fetches the artifact with this job's token; deleted once signed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sign the programs and uninstallers
        uses: ./.github/actions/signpath
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: f210c38b-b4a8-4639-8fe0-f40c7225c8a7
          project-slug: misterdownloadmanager
          signing-policy-slug: ${{ needs.signing.outputs.policy }}
          artifact-name: signing-windows-programs
          artifact-id: ${{ needs.windows-to-sign.outputs.artifact-id }}
          version: ${{ needs.signing.outputs.version }}
          what: the Windows programs and uninstallers
          output-directory: ${{ runner.temp }}/signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-windows-programs-signed
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 1

      - name: The unsigned files' artifact deleted
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ needs.windows-to-sign.outputs.artifact-id }}"
          if ($LASTEXITCODE) { throw "the unsigned files' artifact couldn't be deleted" }

  windows-installers:
    # The installers and zips of every processor signed above, from the signed programs (no
    # build): Inno Setup embeds the signed uninstaller. The zips are done; the installers go to
    # SignPath next.
    needs: [signing, sign-windows]
    if: ${{ !cancelled() && needs.sign-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # deletes the signed programs' artifact once used
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-windows-programs-signed
          path: ${{ runner.temp }}/signed

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Installers and zips, from the signed programs
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64", "x86") {
            $signed = "$env:RUNNER_TEMP/signed/$arch"
            if (-not (Test-Path $signed)) { continue }
            ./tools/installer/build.ps1 -Arch $arch -Signed $signed
          }

      - name: Upload the installers to sign
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-windows-installers
          path: target/dist/MisterDownloadManager-${{ needs.signing.outputs.version }}-setup*.exe
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zips
          path: target/dist/MisterDownloadManager-${{ needs.signing.outputs.version }}-*.zip
          if-no-files-found: error

      - name: The signed programs' artifact deleted
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=signing-windows-programs-signed" --jq '.artifacts[0].id // empty'
          if ($id) { gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; if ($LASTEXITCODE) { throw "the signed programs' artifact couldn't be deleted" } }

  sign-windows-installers:
    # The one signing request for the installers (request 2 of 2 per release), as sign-windows.
    needs: [signing, windows-installers]
    if: ${{ !cancelled() && needs.windows-installers.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write # SignPath fetches the artifact with this job's token; deleted once signed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sign the installers
        uses: ./.github/actions/signpath
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: f210c38b-b4a8-4639-8fe0-f40c7225c8a7
          project-slug: misterdownloadmanager
          signing-policy-slug: ${{ needs.signing.outputs.policy }}
          artifact-name: signing-windows-installers
          artifact-id: ${{ needs.windows-installers.outputs.artifact-id }}
          version: ${{ needs.signing.outputs.version }}
          what: the Windows installers
          output-directory: ${{ runner.temp }}/signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error

      - name: The unsigned installers' artifact deleted
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ needs.windows-installers.outputs.artifact-id }}"
          if ($LASTEXITCODE) { throw "the unsigned installers' artifact couldn't be deleted" }

  extension:
    # The extension as its own download for the Chromium browsers that can't use the Chrome Web
    # Store (unzip, then load the folder unpacked). Firefox's isn't one (#1613): an unsigned .xpi
    # lasts in Firefox only until it restarts, so Firefox gets it from addons.mozilla.org, and the
    # app's own extension folder keeps a copy for developers (about:debugging).
    runs-on: ubuntu-latest
    # The store steps below run only for a pushed tag, and only when their key is there: a run by
    # hand never sends anything to a store. Each key is in the environment of its own step only.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Which store keys are set
        id: keys
        env:
          AMO: ${{ secrets.AMO_JWT_ISSUER }}
          CWS: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          echo "amo=$([ -n "$AMO" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cws=$([ -n "$CWS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tests
        run: node tools/extension/test.mjs

      - name: Chromium zip and the Chrome Web Store's zip
        shell: pwsh
        run: |
          ./tools/extension/pack.ps1
          node tools/extension/check-pack.mjs
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force target/dist | Out-Null
          Copy-Item target/extension/mdm-chromium.zip "target/dist/MisterDownloadManager-$v-extension-chromium.zip"
          # For the Chrome Web Store (the next step, or its dashboard by hand): kept with the
          # build, not the release.
          New-Item -ItemType Directory -Force target/store | Out-Null
          Copy-Item target/extension/mdm-chrome-store.zip "target/store/MisterDownloadManager-$v-chrome-web-store.zip"

      # The stores' tools, at the exact versions and hashes of tools/release/package-lock.json.
      - name: Store tools
        if: ${{ startsWith(github.ref, 'refs/tags/') && (steps.keys.outputs.amo == 'true' || steps.keys.outputs.cws == 'true') }}
        working-directory: tools/release
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Firefox add-on is listed on addons.mozilla.org: each release's version is sent there
      # for review (not waited for); Firefox installs and updates it from its listing. The release
      # has no .xpi (the unsigned one is gone at Firefox's next restart, #1613).
      - name: Send the Firefox add-on to addons.mozilla.org
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.keys.outputs.amo == 'true' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: pwsh
        run: |
          $log = & ./tools/release/node_modules/.bin/web-ext sign --source-dir target/extension/firefox --artifacts-dir target/signed `
            --channel listed --approval-timeout 0 --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET 2>&1
          $log | Write-Output
          if ($LASTEXITCODE -ne 0) {
            # A re-run: Mozilla refuses a version it has already. Anything else fails here.
            if (($log -join "`n") -match "already exists") {
              Write-Output "::warning::This version is on addons.mozilla.org already."
              exit 0
            }
            exit 1
          }

      # The extension is listed in the Chrome Web Store (ejoleppdfgjdndddcjoehopknmlglojp,
      # crates/ipc STORE_ID): each release's zip is uploaded and sent for review (not waited for);
      # Chrome, Edge, Brave, Opera and Vivaldi update from the listing. A store refusal (a version
      # it has already) never fails the release.
      - name: Send the extension to the Chrome Web Store
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.keys.outputs.cws == 'true' }}
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ejoleppdfgjdndddcjoehopknmlglojp
        run: ./tools/release/node_modules/.bin/chrome-webstore-upload --source target/extension/mdm-chrome-store.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store
          path: target/store/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: target/dist/*

  linux:
    # The oldest supported Ubuntu: the programs run on its glibc (2.35) and newer. x86-64 and
    # ARM64, each on a runner of its own.
    name: linux-${{ matrix.arch }}
    needs: geo
    # As Windows' (above).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev rpm python3-pil zsync \
            cmake libclang-dev

      # The extension is packed with PowerShell (tools/extension/pack.ps1): on a runner without
      # it (ARM's), PowerShell's own build for the machine, checked against its release's list.
      - name: PowerShell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if command -v pwsh >/dev/null; then exit 0; fi
          v=7.4.6
          case "$(uname -m)" in aarch64) a=arm64 ;; *) a=x64 ;; esac
          file="powershell-$v-linux-$a.tar.gz"
          python3 tools/installer/fetch_release.py PowerShell/PowerShell "v$v" "$file" "$RUNNER_TEMP/$file"
          python3 tools/installer/fetch_release.py PowerShell/PowerShell "v$v" hashes.sha256 "$RUNNER_TEMP/hashes.sha256"
          want=$(tr -d '\r' < "$RUNNER_TEMP/hashes.sha256" | awk -v f="$file" '{n=$2; sub(/^\*/, "", n)} n == f {print tolower($1)}')
          got=$(sha256sum "$RUNNER_TEMP/$file" | cut -d' ' -f1)
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "$file: checksum $got, the list says ${want:-nothing}" >&2; exit 1; }
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar -xzf "$RUNNER_TEMP/$file" -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: AppImage, tar.gz, .deb, .rpm
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: bash tools/installer/build-linux.sh

      # The programs on the machine that built them: for this processor, and a download works.
      - name: Smoke test
        run: python3 tools/installer/smoke.py target/release ${{ matrix.arch }}

      # x64's under the name it always had ("linux"), ARM64's with its processor.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch == 'x64' && 'linux' || format('linux-{0}', matrix.arch) }}
          path: target/dist/*

  macos:
    needs: geo
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Apple Silicon and Intel .dmg
        env:
          GH_TOKEN: ${{ github.token }} # downloads the build's helpers signed in (fetch_release.py)
        run: bash tools/installer/build-macos.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: target/dist/*

  publish:
    permissions:
      contents: write # the release
      actions: write # rebuilding the website
      issues: read # the release notes' Thanks to (tools/contributors.py)
      pull-requests: read
      id-token: write # build provenance: signs the attestation (Sigstore, keyless)
      attestations: write # build provenance: stores it on the repository
    # x64 Windows is checked below by its files: the Windows job's result says failure when any
    # processor's build failed, and only x64's must be there. With SignPath, nothing is published
    # unless the installers' signing request (the last one) succeeded.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result != 'cancelled' &&
      needs.extension.result == 'success' && needs.signing.result == 'success' &&
      (needs.signing.outputs.policy == '' || needs.sign-windows-installers.result == 'success')
    needs: [signing, windows, sign-windows-installers, extension, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every artifact of the run goes into the release: none of the signing jobs' own may be left
      # (unsigned files among them), which their jobs delete once used.
      - name: No signing artifact left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("signing-")) | .name')
          if [ -n "$left" ]; then echo "signing artifacts left in the run: $left" >&2; exit 1; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # SignPath's jobs checked their files; this checks the ones being published.
      - name: Every Windows program signed
        if: needs.signing.outputs.policy != ''
        run: python3 tools/release/check_signed.py dist

      # Build provenance: a signed record that each file was built here, by this workflow, from
      # this tag. Anyone can check a download with
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # (Windows, Linux, macOS and the extension: everything the release ships but the checksums.)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MisterDownloadManager-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MDM_RELEASE_KEY: ${{ secrets.MDM_RELEASE_KEY }}
        shell: pwsh
        run: |
          # The release waits for x64 Windows (the names every copy before had): its files or none.
          $v = "${{ github.ref_name }}".TrimStart("v")
          foreach ($f in "setup.exe", "portable.zip", "x64.zip") {
            if (-not (Test-Path "dist/MisterDownloadManager-$v-$f")) { throw "x64 Windows' $f isn't there: no release" }
          }
          # One SHA256SUMS.txt for every file (each build wrote its own).
          Remove-Item dist/SHA256SUMS*.txt -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Encoding ascii dist/SHA256SUMS.txt $sums
          # Signed with MDM's release key (fingerprint 5826D399249DE856EA087D802E293C28E8A69D74):
          # MDM updates itself only from a list it signed
          # (crates/tools/src/update.rs; the public key is crates/tools/keys/mdm-release.asc).
          if ($env:MDM_RELEASE_KEY) {
            $key = Join-Path $env:RUNNER_TEMP "mdm-release.asc"
            Set-Content -Encoding ascii $key $env:MDM_RELEASE_KEY
            gpg --batch --quiet --import $key
            Remove-Item $key
            gpg --batch --yes --detach-sign --local-user 5826D399249DE856EA087D802E293C28E8A69D74 `
              --output dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "signing SHA256SUMS.txt failed" }
            gpg --batch --verify dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "the signature of SHA256SUMS.txt doesn't verify" }
            # The ffmpeg builds MDM installs (tools/release/ffmpeg-builds.txt, made by
            # tools/release/ffmpeg_list.py), signed with the same key: MDM fetches this list from
            # its latest release and installs only a build it names (crates/tools/src/ffmpeg.rs).
            # Beside SHA256SUMS.txt, not in it: a newer list signed between releases replaces it.
            Copy-Item tools/release/ffmpeg-builds.txt dist/ffmpeg-builds.txt
            gpg --batch --yes --detach-sign --local-user 5826D399249DE856EA087D802E293C28E8A69D74 `
              --output dist/ffmpeg-builds.txt.sig dist/ffmpeg-builds.txt
            if ($LASTEXITCODE) { throw "signing ffmpeg-builds.txt failed" }
            gpg --batch --verify dist/ffmpeg-builds.txt.sig dist/ffmpeg-builds.txt
            if ($LASTEXITCODE) { throw "the signature of ffmpeg-builds.txt doesn't verify" }
          } else {
            Write-Warning "MDM_RELEASE_KEY isn't set: this release is unsigned, MDM won't update to it by itself, and MDM can't install ffmpeg until a signed ffmpeg-builds.txt is added to it (tools/release/ffmpeg_list.py)."
          }
          # Notes: the version's section of CHANGELOG.md ("## [X.Y.Z]" up to the next "## "),
          # else GitHub's list of changes since the last tag. First, the browser add-on's stores
          # (#1613: the release has no file for Firefox, and the stores' copies update themselves),
          # then the invitation to try the macOS builds when they are there (Linux's files are no
          # longer "-experimental").
          $v = "${{ github.ref_name }}".TrimStart("v")
          $log = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $m = [regex]::Match("$log", "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $title = "Mister Download Manager ${{ github.ref_name }}"
          $stores = "**The browser add-on:** [Add to Firefox](https://addons.mozilla.org/firefox/addon/mister-download-manager/) " +
            "(Zen, LibreWolf too) · [Add to Chrome, Edge, Brave, Opera, Vivaldi](https://chromewebstore.google.com/detail/mister-download-manager/ejoleppdfgjdndddcjoehopknmlglojp). " +
            "The stores' copy updates itself; ``-extension-chromium.zip`` is only for a Chromium browser that can't use its store.`n`n"
          $invite = ""
          if ($files.Name -like "*-experimental*") {
            $invite = "**On a Mac?** The ``-experimental`` files are fresh builds for Mac " +
              "(Apple Silicon and Intel) that we haven't tried ourselves yet. Want to be among " +
              "the first? Give them a go and tell us how it went in an " +
              "[issue](https://github.com/${{ github.repository }}/issues).`n`n"
          }
          # Last, "Thanks to": everyone who opened a pull request or an issue, or commented, on
          # GitHub since the previous release (by version) was published, with their avatars and
          # @-mentions (tools/contributors.py thanks; the maintainer, Claude and bots aren't
          # counted). Nobody, or GitHub not answering, leaves it out; it never stops the release.
          $thanks = ""
          try {
            $thanks = (python3 tools/contributors.py thanks "${{ github.ref_name }}" | Out-String).Trim()
          } catch {
            Write-Warning "The contributors couldn't be listed: $_"
          }
          if ($thanks) { $thanks = "`n`n" + $thanks }
          $all = (Get-ChildItem dist -File).FullName
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            # Links into the repository (docs/x.md) would resolve against the release's page:
            # point them at the tagged files.
            $notes = $m.Groups[1].Value.Trim() -replace '\]\((?![a-z]+:|#)([^)\s]+)\)', '](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$1)'
            Set-Content -Encoding utf8 notes.md ($stores + $invite + $notes + $thanks)
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md $all
          } else {
            Set-Content -Encoding utf8 notes.md ($stores + $invite + $thanks.Trim())
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md --generate-notes $all
          }
          # The website links to the latest published release: rebuild it now that the files are
          # there (a release made with this token starts no workflow by itself).
          gh workflow run pages.yml --ref main

  docker:
    # A published Docker image for servers and NAS systems (docs/server.md, Dockerfile).
    name: docker
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Image tags
        id: tags
        run: |
          ref="${GITHUB_REF_NAME#v}"
          repo="${GITHUB_REPOSITORY,,}"
          echo "tags=ghcr.io/${repo}:latest,ghcr.io/${repo}:${GITHUB_REF_NAME},ghcr.io/${repo}:${ref}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
