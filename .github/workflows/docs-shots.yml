# The README's, docs/' and the site's screenshots (tools/lab/docs-shots.ps1), taken on GitHub's
# Windows runner: a stock Windows, so the file icons in them are Windows' own, not those of
# programs someone installed. Run by hand (Actions → Docs screenshots → Run workflow) or by a
# push to a docs-shots/** branch. Never on other pushes or pull requests. The PNGs come back as
# the "docs-shots" artifact, with what the runner had (screen, DPI, fonts, file associations);
# a person puts them in docs/images and runs tools/website/screens.py. The help pages' pictures
# come back raw in help-raw/: into target/shots/raw, then `python tools/shots/make.py build`.
name: Docs screenshots

on:
  workflow_dispatch:
  push:
    branches: ["docs-shots/**"]

permissions:
  contents: read

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # tools/shots/make.py (the help pages' pictures) reads its list with tomllib.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: rustup show active-toolchain; if (-not $?) { rustup toolchain install }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build -p mdm-app -p mdm-labserver

      # The runner has no GPU and only Windows' OpenGL 1.1; the app needs 3.x. Mesa's llvmpipe
      # (software OpenGL 4.6) is put beside the program for this job only (mesa-dist-win,
      # pinned and checked).
      - name: Software OpenGL (Mesa llvmpipe)
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          $sum = (Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash
          if ($sum -ne "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695") { throw "mesa checksum $sum" }
          7z e "$env:RUNNER_TEMP\mesa.7z" -otarget\debug x64\opengl32.dll x64\libgallium_wgl.dll -y
          if ($LASTEXITCODE) { throw "7z $LASTEXITCODE" }

      # What the shots were taken with, kept beside them.
      - name: The runner's screen, DPI, fonts and file associations
        run: |
          $out = "$env:RUNNER_TEMP\shots"; New-Item -ItemType Directory -Force $out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          & {
            "Windows: " + (Get-CimInstance Win32_OperatingSystem).Caption + " " + [Environment]::OSVersion.Version
            "Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            "DPI: " + (Get-ItemProperty "HKCU:\Control Panel\Desktop\WindowMetrics" -ErrorAction SilentlyContinue).AppliedDPI
            "Session: " + [Environment]::UserInteractive + ", " + (whoami)
            ""
            "Fonts:"
            $fonts = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
            foreach ($f in "Segoe UI", "Tahoma", "Arial", "Microsoft Sans Serif") {
              $hit = $fonts.PSObject.Properties | Where-Object { $_.Name -like "$f (*" -or $_.Name -like "$f &*" } | Select-Object -First 1
              "  $f : " + $(if ($hit) { $hit.Value } else { "missing" })
            }
            ""
            "File associations (HKEY_CLASSES_ROOT; the user's own choice, if any):"
            foreach ($e in ".pdf", ".mp3", ".mp4", ".mkv", ".csv", ".zip", ".exe", ".docx", ".msi", ".iso", ".txt", ".srt") {
              $prog = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\$e" -ErrorAction SilentlyContinue)."(default)"
              $icon = if ($prog) { (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\$prog\DefaultIcon" -ErrorAction SilentlyContinue)."(default)" }
              $choice = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\$e\UserChoice" -ErrorAction SilentlyContinue).ProgId
              "  $e -> " + $(if ($prog) { $prog } else { "(none)" }) + $(if ($icon) { "  icon: $icon" }) + $(if ($choice) { "  user choice: $choice" })
            }
          } | Tee-Object "$out\runner.txt"

      - name: Screenshots
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\shots"
          $exe = "target\debug\misterdownloadmanager.exe"; $srv = "target\debug\labserver.exe"
          $torrent = "tools\lab\Open Movie Night.torrent"
          # A neutral folder and address, as they show in the shots (Properties, Add torrent): the
          # downloads come from downloads.example (a reserved name, pointed at the lab server
          # on 127.0.0.1 in this runner's hosts file) on port 80. Windows' HTTP service may hold
          # port 80 (it answers 404): it is stopped, and 8080 taken if the port stays busy.
          $work = "C:\Demo"
          Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n127.0.0.1 downloads.example"
          $busy = { [bool](Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue) }
          if (& $busy) { cmd /c "net stop http /y" | Out-Null }
          $port = if (& $busy) { 8080 } else { 80 }
          $base = if ($port -eq 80) { "http://downloads.example" } else { "http://downloads.example:$port" }
          # The address reaches the lab server, or no shot is taken.
          $lab = Start-Process -PassThru -WindowStyle Hidden $srv -ArgumentList "--bind 127.0.0.1:$port"
          Start-Sleep 2
          try { $code = (Invoke-WebRequest -UseBasicParsing "$base/gen/1K/check.bin").StatusCode } finally { Stop-Process -Id $lab.Id }
          "lab server at $base answers $code" | Tee-Object -Append "$out\runner.txt"
          if ($code -ne 200) { throw "the lab server isn't reached at $base" }
          $net = @{ Port = $port; UrlHost = "downloads.example" }
          # On the screen, as nobody watches it: llvmpipe draws nothing off the screens.
          $at = "40,40"
          tools\lab\docs-shots.ps1 -Exe $exe -Server $srv -Torrent $torrent -Work $work -At $at @net -OutDir "$out\docs" -Only main-light, add-torrent, properties, progress
          tools\lab\docs-shots.ps1 -Exe $exe -Server $srv -Work $work -At $at @net -OutDir "$out\docs" -Only main-dark
          tools\lab\docs-shots.ps1 -Exe $exe -Server $srv -Work $work -At $at @net -OutDir "$out\docs" -Lang ar -Only arabic-main
          tools\lab\docs-shots.ps1 -Exe $exe -Server $srv -Torrent $torrent -Work $work -At $at @net -Dark -OutDir "$out\site-dark" -Only main-dark, add-torrent, progress
          # The help pages' pictures (tools/shots/shots.toml), light and dark, raw: a person runs
          # `python tools/shots/make.py build` on them (crop, annotate, WebP) and commits that.
          python tools\shots\make.py shoot --bin target\debug --work $work --at $at --url-host downloads.example --port $port
          if ($LASTEXITCODE) { throw "make.py shoot $LASTEXITCODE" }
          Copy-Item -Recurse target\shots\raw "$out\help-raw"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-shots
          path: ${{ runner.temp }}/shots
