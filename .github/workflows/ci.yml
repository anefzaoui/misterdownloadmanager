# Build, lint and test for every push and pull request: Windows, and the experimental Linux and
# macOS builds (their failures are reported but don't fail the run).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks stable with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --all --check

      # A text added to the code without running tools/i18n/extract.py fails here; missing
      # translations don't (they show in English until tools/i18n/translate.py runs).
      - name: English catalog matches the code
        if: runner.os == 'Windows'
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip) and Firefox (mdm-firefox.xpi).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
