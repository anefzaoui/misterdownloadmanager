# Builds misterdownloadmanager.com (tools/website/build.py: website/, docs/, CHANGELOG.md and the
# language list, then every page again in each language of i18n/site/, tools/website/sitei18n.py)
# and publishes it with GitHub Pages, on every push to main that touches them, and
# once a day so the repository's star, fork and issue counts and its contributors (the home page,
# /contributors.html, the News page; tools/contributors.py) on the site stay current.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "i18n/languages.tsv"
      - "i18n/site/**"
      - "tools/website/**"
      - "tools/contributors.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Read-only; only the deploy job may publish the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install markdown==3.10
          python tools/website/build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # prove to Pages that this run is the repository's
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
