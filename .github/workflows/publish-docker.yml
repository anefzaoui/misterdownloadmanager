name: Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'MDM version (leave blank for latest upstream release)'
        required: false
        default: ''

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Get Target MDM Version
        id: mdm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER=$(gh release view --repo anefzaoui/misterdownloadmanager --json tagName --jq .tagName 2>/dev/null || true)
            if [ -z "$VER" ] || [ "$VER" = "null" ]; then
              VER=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/anefzaoui/misterdownloadmanager/releases/latest" | jq -r .tag_name)
            fi
          fi
          VER="${VER#v}"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::Could not determine valid MDM version"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Target MDM version: ${VER}"

      - name: Download and Extract MDM Release Tarballs
        run: |
          bash docker/download.sh "${{ steps.mdm.outputs.version }}" all bin

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.mdm.outputs.version }}
